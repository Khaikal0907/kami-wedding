<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KaMi Wedding Admin</title>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f2ec;color:#29251f}button,input,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-box{width:min(390px,100%);background:#fff;padding:32px;border-radius:20px;border:1px solid #e5ddd2;box-shadow:0 12px 40px #00000010;text-align:center}.login-box h1{margin:0 0 6px}.muted{color:#83786d;font-size:13px}.field{text-align:left;margin:18px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid #d8cfc3;border-radius:11px;padding:12px;outline:0}.field input:focus,.field textarea:focus{border-color:#75634d}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#514332;color:white}.secondary{background:#eee8df;color:#40382f}.danger{background:#f8dfdd;color:#9b2f27}.login-btn{width:100%;padding:13px}.layout{min-height:100vh;display:flex}.side{width:230px;background:#2f2923;color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0}.logo{font-size:21px;font-weight:800;padding:8px 12px 24px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#d9d1c8;border:0;padding:12px;border-radius:10px;cursor:pointer;margin:3px 0}.nav button.active,.nav button:hover{background:#51473b;color:#fff}.logout{position:absolute;bottom:20px;left:14px;right:14px}.main{margin-left:230px;width:calc(100% - 230px);padding:28px;max-width:1300px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:25px}.user{background:#fff;padding:8px 12px;border-radius:10px;border:1px solid #e6ded4}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e5ddd2;border-radius:16px;padding:20px}.card h3{margin:0 0 7px}.num{font-size:30px;font-weight:800}.toolbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.search{width:300px;padding:11px;border:1px solid #d8cfc3;border-radius:10px}.table-wrap{overflow:auto;background:#fff;border:1px solid #e5ddd2;border-radius:15px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 12px;border-bottom:1px solid #eee8df;text-align:left;white-space:nowrap}.table th{font-size:12px;text-transform:uppercase;color:#786e64}.badge{display:inline-block;padding:5px 9px;border-radius:99px;font-size:12px}.sent{background:#e2f2e7;color:#247042}.pending{background:#eee9e1;color:#766b60}.actions{display:flex;gap:6px}.form-card{max-width:650px}.config-card{max-width:800px}.hint{font-size:12px;color:#81776e;margin-top:5px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#29251f;color:white;padding:10px 16px;border-radius:10px}@media(max-width:760px){.side{width:70px;padding:16px 8px}.logo{font-size:0;text-align:center}.logo:after{content:'K';font-size:22px}.nav button{font-size:0;text-align:center}.nav button:before{font-size:20px}.nav button:nth-child(1):before{content:'⌂'}.nav button:nth-child(2):before{content:'♙'}.nav button:nth-child(3):before{content:'⚙'}.logout{font-size:0}.logout:after{content:'↪';font-size:20px}.main{margin-left:70px;width:calc(100% - 70px);padding:18px}.cards{grid-template-columns:1fr}.toolbar{flex-direction:column}.search{width:100%}.top{align-items:flex-start}.top h1{font-size:21px}.actions{flex-wrap:wrap}.actions .btn{padding:9px 10px}}</style>
</head><body>
<div id="login" class="login"><div class="login-box"><h1>KaMi Wedding</h1><div class="muted">Admin Invitation</div><div class="field"><label>Username</label><input id="loginUser" placeholder="khaikal / mimi" autocomplete="username"></div><button class="btn primary login-btn" onclick="login()">Login</button><div id="err" style="color:#a8322a;font-size:13px;margin-top:10px"></div></div></div>
<div id="app" class="layout hidden"><aside class="side"><div class="logo">KaMi Wedding</div><nav class="nav"><button id="navDashboard" onclick="page('dashboard')">Dashboard</button><button id="navGuests" onclick="page('guests')">Data Tamu</button><button id="navConfig" onclick="page('config')">Config</button></nav><button class="btn secondary logout" onclick="logout()">Logout</button></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted">KaMi Wedding Invitation</div></div><div class="user">👤 <b id="currentUser"></b></div></div><section id="content"></section></main></div><div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL="https://hcyziqzfbplowikqpdiv.supabase.co";
const SUPABASE_KEY="sb_publishable_luL_azGk6owIwY82TsiH7Q_14CCnbdq";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const SHARED_PASSWORD="KamiWedding2026";
const USERS={khaikal:{email:"khaikal@kami-wedding.local",label:"Khaikal"},mimi:{email:"mimi@kami-wedding.local",label:"Mimi"}};
const BASE="https://waktutemu.id/java-heritage/";
const DEFAULT_TEMPLATE=`Kepada Yth.
Bapak/Ibu/Saudara/i
{{nama}}
_______

Assalamualaikum Warahmatullahi Wabarakatuh

Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i, teman sekaligus sahabat, untuk menghadiri acara pernikahan kami.

Berikut link undangan kami, untuk info lengkap dari acara, bisa kunjungi :

{{link}}

Merupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan untuk hadir dan memberikan doa restu.

Wassalamualaikum Warahmatullahi Wabarakatuh

Terima kasih banyak atas perhatian dan doanya.

Khaikal & Mimi`;
let user=sessionStorage.getItem("kami_user"),currentPage="dashboard",editId=null;
function cfg(){return window._cfg||{invite_link:BASE,whatsapp_template:DEFAULT_TEMPLATE}}
async function guests(){const{data}=await sb.from("guests").select("*").eq("user_id",window._uid).order("created_at",{ascending:false});return data||[]}
function link(name){return(cfg().invite_link||BASE).replace(/\/?$/,"/")+"?to="+encodeURIComponent(name.trim())}
function message(name){return(cfg().whatsapp_template||DEFAULT_TEMPLATE).replaceAll("{{nama}}",name).replaceAll("{{link}}",link(name))}
function toast(s){let x=document.getElementById("toast");x.textContent=s;x.classList.remove("hidden");setTimeout(()=>x.classList.add("hidden"),1700)}
async function login(){let u=document.getElementById("loginUser").value.trim().toLowerCase();if(!USERS[u]){document.getElementById("err").textContent="Username tidak tersedia.";return}const{data,error}=await sb.auth.signInWithPassword({email:USERS[u].email,password:SHARED_PASSWORD});if(error){document.getElementById("err").textContent="Login gagal: "+error.message;return}user=u;sessionStorage.setItem("kami_user",u);window._uid=data.user.id;await loadConfig();start()}
async function start(){user=sessionStorage.getItem("kami_user");if(!USERS[user])return;const sess=(await sb.auth.getSession()).data.session;if(!sess)return;window._uid=sess.user.id;document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("currentUser").textContent=USERS[user].label;document.getElementById("navConfig").classList.toggle("hidden",user!=="khaikal");page("dashboard")}
async function logout(){await sb.auth.signOut();sessionStorage.clear();location.reload()}
async function loadConfig(){const{data}=await sb.from("config").select("*").limit(1).maybeSingle();if(data)window._cfg=data}
function page(p){if(p==="config"&&user!=="khaikal")p="dashboard";currentPage=p;document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));document.getElementById("nav"+p[0].toUpperCase()+p.slice(1)).classList.add("active");document.getElementById("title").textContent=p==="dashboard"?"Dashboard":p==="guests"?"Data Tamu":"Config";p==="dashboard"?dashboard():p==="guests"?guestPage():configPage()}
async function dashboard(){let d=await guests(),s=d.filter(x=>x.status==="Terkirim").length;document.getElementById("content").innerHTML=`<div class="cards"><div class="card"><h3>Total Tamu</h3><div class="num">${d.length}</div></div><div class="card"><h3>Terkirim</h3><div class="num">${s}</div></div><div class="card"><h3>Belum Terkirim</h3><div class="num">${d.length-s}</div></div></div><div class="card" style="margin-top:18px"><h3>Selamat datang, ${USERS[user].label}</h3><div class="muted">Gunakan menu Data Tamu untuk mengelola daftar undangan.</div></div>`}
async function guestPage(){document.getElementById("content").innerHTML=`<div class="toolbar"><input id="q" class="search" placeholder="Cari nama / phone..." oninput="renderList()"><button class="btn primary" onclick="guestForm()">+ Tambah Data</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Nama</th><th>Phone</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="list"></tbody></table></div>`;renderList()}
async function renderList(){let q=(document.getElementById("q")?.value||"").toLowerCase(),d=(await guests()).filter(x=>(x.name+" "+x.phone).toLowerCase().includes(q));document.getElementById("list").innerHTML=d.length?d.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone)}</td><td><span class="badge ${x.status==="Terkirim"?"sent":"pending"}">${esc(x.status)}</span></td><td><div class="actions"><button class="btn secondary" onclick="guestForm('${x.id}')">Edit</button><button class="btn primary" onclick="sendWA('${x.id}')">Kirim WA</button><button class="btn secondary" onclick="copyMessage('${x.id}')">Salin Pesan</button><button class="btn danger" onclick="del('${x.id}')">Delete</button></div></td></tr>`).join(""):`<tr><td colspan="4" class="muted">Belum ada data tamu.</td></tr>`}
async function guestForm(id=""){editId=id;let d=await guests(),x=id?d.find(a=>a.id===id):{name:"",phone:""};document.getElementById("content").innerHTML=`<div class="card form-card"><h3>${id?"Edit Data":"Tambah Data"}</h3><div class="field"><label>Nama</label><input id="gname" value="${esc(x.name)}"></div><div class="field"><label>Phone</label><input id="gphone" value="${esc(x.phone)}" placeholder="08123456789"></div><button class="btn primary" onclick="saveGuest()">Simpan</button> <button class="btn secondary" onclick="page('guests')">Batal</button></div>`}
async function saveGuest(){let name=document.getElementById("gname").value.trim(),phone=document.getElementById("gphone").value.trim();if(!name||!phone)return toast("Nama dan Phone wajib diisi.");let r=editId?await sb.from("guests").update({name,phone,updated_at:new Date().toISOString()}).eq("id",editId):await sb.from("guests").insert({user_id:window._uid,owner_username:user,name,phone,status:"Belum"});if(r.error)return toast(r.error.message);toast("Data tersimpan.");page("guests")}
async function del(id){if(!confirm("Hapus data tamu ini?"))return;let r=await sb.from("guests").delete().eq("id",id);if(r.error)return toast(r.error.message);renderList();toast("Data dihapus.")}
function normalizePhone(phone){let n=String(phone||"").trim().replace(/\D/g,"");if(n.startsWith("62"))return n;if(n.startsWith("0"))return "62"+n.slice(1);if(n.startsWith("8"))return "62"+n;return n}
async function copyMessage(id){let d=await guests(),x=d.find(a=>a.id===id);if(!x)return;let msg=message(x.name);try{await navigator.clipboard.writeText(msg);toast("Pesan berhasil disalin.")}catch(e){let ta=document.createElement("textarea");ta.value=msg;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("Pesan berhasil disalin.")}}
async function sendWA(id){let d=await guests(),x=d.find(a=>a.id===id);if(!x)return;let n=normalizePhone(x.phone);if(!n||n.length<10)return toast("Nomor HP tidak valid.");let waUrl="https://wa.me/"+n+"?text="+encodeURIComponent(message(x.name));sb.from("guests").update({status:"Terkirim",updated_at:new Date().toISOString()}).eq("id",id);window.location.href=waUrl}
function configPage(){let c=cfg();document.getElementById("content").innerHTML=`<div class="card config-card"><h3>Config</h3><div class="field"><label>Link</label><input id="clink" value="${esc(c.invite_link||BASE)}"></div><div class="field"><label>Template WA</label><textarea id="ctemplate" rows="18">${esc(c.whatsapp_template||DEFAULT_TEMPLATE)}</textarea><div class="hint">Gunakan <b>{{nama}}</b> dan <b>{{link}}</b>.</div></div><button class="btn primary" onclick="saveConfig()">Simpan Config</button></div>`}
async function saveConfig(){let r=await sb.from("config").update({invite_link:document.getElementById("clink").value.trim(),whatsapp_template:document.getElementById("ctemplate").value,updated_at:new Date().toISOString()}).eq("id",cfg().id);if(r.error)return toast(r.error.message);await loadConfig();toast("Config tersimpan.")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
if(user)start();
</script>
</body></html>
