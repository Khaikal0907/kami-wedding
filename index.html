<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KaMi Wedding Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f5f2ec;color:#29251f}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center}.login-box,.card{background:#fff;padding:24px;border-radius:16px}.side{position:fixed;left:0;top:0;bottom:0;width:230px;background:#2f2923;color:#fff;padding:20px}.main{margin-left:230px;padding:28px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#514332;color:white}.secondary{background:#eee8df;color:#40382f}.danger{background:#f8dfdd;color:#9b2f27}.actions{display:flex;gap:6px;flex-wrap:wrap}.table-wrap{overflow:auto;background:#fff;border:1px solid #e5ddd2;border-radius:15px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px;border-bottom:1px solid #eee8df;text-align:left;white-space:nowrap}.field{margin:18px 0}.field input,.field textarea{width:100%;padding:12px;border:1px solid #d8cfc3;border-radius:11px;box-sizing:border-box}@media(max-width:760px){.side{width:70px}.main{margin-left:70px;padding:18px}.actions .btn{padding:9px 10px}}</style></head><body><div id="login" class="login"><div class="login-box"><h1>KaMi Wedding</h1><p>Admin Invitation</p><div class="field"><label>Username</label><input id="loginUser" placeholder="khaikal / mimi"></div><button class="btn primary" style="width:100%" onclick="login()">Login</button><div id="err"></div></div></div><div id="app" class="hidden"><aside class="side"><h2>KaMi Wedding</h2><button class="btn secondary" onclick="page('dashboard')">Dashboard</button><br><br><button class="btn secondary" onclick="page('guests')">Data Tamu</button><br><br><button id="navConfig" class="btn secondary" onclick="page('config')">Config</button><button class="btn secondary" style="position:absolute;bottom:20px;left:20px" onclick="logout()">Logout</button></aside><main class="main"><h1 id="title">Dashboard</h1><div>👤 <b id="currentUser"></b></div><section id="content"></section></main></div><div id="toast" class="hidden" style="position:fixed;bottom:20px;left:50%;background:#29251f;color:#fff;padding:10px 16px;border-radius:10px"></div><script>const SUPABASE_URL="https://hcyziqzfbplowikqpdiv.supabase.co",SUPABASE_KEY="sb_publishable_luL_azGk6owIwY82TsiH7Q_14CCnbdq",sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),SHARED_PASSWORD="KamiWedding2026",USERS={khaikal:{email:"khaikal@kami-wedding.local",label:"Khaikal"},mimi:{email:"mimi@kami-wedding.local",label:"Mimi"}},BASE="https://waktutemu.id/java-heritage/",DEFAULT_TEMPLATE=`Kepada Yth.\nBapak/Ibu/Saudara/i\n{{nama}}\n_______\n\nAssalamualaikum Warahmatullahi Wabarakatuh\n\nTanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i, teman sekaligus sahabat, untuk menghadiri acara pernikahan kami.\n\nBerikut link undangan kami, untuk info lengkap dari acara, bisa kunjungi :\n\n{{link}}\n\nMerupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan untuk hadir dan memberikan doa restu.\n\nWassalamualaikum Warahmatullahi Wabarakatuh\n\nTerima kasih banyak atas perhatian dan doanya.\n\nKhaikal & Mimi`;let user=sessionStorage.getItem('kami_user'),editId=null;function cfg(){return window._cfg||{invite_link:BASE,whatsapp_template:DEFAULT_TEMPLATE}}async function guests(){const{data}=await sb.from('guests').select('*').eq('user_id',window._uid).order('created_at',{ascending:false});return data||[]}function link(n){return(cfg().invite_link||BASE).replace(/\/?$/,'/')+'?to='+encodeURIComponent(n.trim())}function message(n){return(cfg().whatsapp_template||DEFAULT_TEMPLATE).replaceAll('{{nama}}',n).replaceAll('{{link}}',link(n))}function normalizePhone(p){let n=String(p||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n='62'+n;return n}function toast(s){let x=document.getElementById('toast');x.textContent=s;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),1700)}async function login(){let u=document.getElementById('loginUser').value.trim().toLowerCase();if(!USERS[u])return document.getElementById('err').textContent='Username tidak tersedia.';let{data,error}=await sb.auth.signInWithPassword({email:USERS[u].email,password:SHARED_PASSWORD});if(error)return document.getElementById('err').textContent='Login gagal: '+error.message;user=u;sessionStorage.setItem('kami_user',u);window._uid=data.user.id;await loadConfig();start()}async function start(){user=sessionStorage.getItem('kami_user');if(!USERS[user])return;let sess=(await sb.auth.getSession()).data.session;if(!sess)return;window._uid=sess.user.id;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('currentUser').textContent=USERS[user].label;document.getElementById('navConfig').classList.toggle('hidden',user!=='khaikal');page('dashboard')}async function logout(){await sb.auth.signOut();sessionStorage.clear();location.reload()}async function loadConfig(){let{data}=await sb.from('config').select('*').limit(1).maybeSingle();if(data)window._cfg=data}function page(p){if(p==='config'&&user!=='khaikal')p='dashboard';document.getElementById('title').textContent=p==='dashboard'?'Dashboard':p==='guests'?'Data Tamu':'Config';p==='dashboard'?dashboard():p==='guests'?guestPage():configPage()}async function dashboard(){let d=await guests(),s=d.filter(x=>x.status==='Terkirim').length;document.getElementById('content').innerHTML=`<div class="card"><h3>Total Tamu</h3><h1>${d.length}</h1><h3>Terkirim: ${s}</h3><h3>Belum Terkirim: ${d.length-s}</h3><p>Selamat datang, ${USERS[user].label}</p></div>`}async function guestPage(){document.getElementById('content').innerHTML=`<div style="margin:20px 0"><input id="q" placeholder="Cari nama / phone..." oninput="renderList()"> <button class="btn primary" onclick="guestForm()">+ Tambah Data</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Nama</th><th>Phone</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="list"></tbody></table></div>`;renderList()}async function renderList(){let q=(document.getElementById('q')?.value||'').toLowerCase(),d=(await guests()).filter(x=>(x.name+' '+x.phone).toLowerCase().includes(q));document.getElementById('list').innerHTML=d.length?d.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone)}</td><td>${esc(x.status)}</td><td><div class="actions"><button class="btn secondary" onclick="guestForm('${x.id}')">Edit</button><button class="btn primary" onclick="sendWA('${x.id}')">Kirim WA</button><button class="btn secondary" onclick="copyMessage('${x.id}')">Salin Pesan</button><button class="btn danger" onclick="del('${x.id}')">Delete</button></div></td></tr>`).join(''):`<tr><td colspan="4">Belum ada data tamu.</td></tr>`}async function guestForm(id=''){editId=id;let d=await guests(),x=id?d.find(a=>a.id===id):{name:'',phone:''};document.getElementById('content').innerHTML=`<div class="card"><h3>${id?'Edit Data':'Tambah Data'}</h3><div class="field"><label>Nama</label><input id="gname" value="${esc(x.name)}"></div><div class="field"><label>Phone</label><input id="gphone" value="${esc(x.phone)}" placeholder="08123456789"></div><button class="btn primary" onclick="saveGuest()">Simpan</button> <button class="btn secondary" onclick="page('guests')">Batal</button></div>`}async function saveGuest(){let name=document.getElementById('gname').value.trim(),phone=document.getElementById('gphone').value.trim();if(!name||!phone)return toast('Nama dan Phone wajib diisi.');let r=editId?await sb.from('guests').update({name,phone,updated_at:new Date().toISOString()}).eq('id',editId):await sb.from('guests').insert({user_id:window._uid,owner_username:user,name,phone,status:'Belum'});if(r.error)return toast(r.error.message);toast('Data tersimpan.');page('guests')}async function del(id){if(!confirm('Hapus data tamu ini?'))return;let r=await sb.from('guests').delete().eq('id',id);if(r.error)return toast(r.error.message);renderList();toast('Data dihapus.')}async function sendWA(id){let d=await guests(),x=d.find(a=>a.id===id);if(!x)return;let n=normalizePhone(x.phone);if(!n)return toast('Nomor HP tidak valid.');window.location.href='https://wa.me/'+n+'?text='+encodeURIComponent(message(x.name));setTimeout(()=>sb.from('guests').update({status:'Terkirim',updated_at:new Date().toISOString()}).eq('id',id),1000)}async function copyMessage(id){let d=await guests(),x=d.find(a=>a.id===id);if(!x)return;let text=message(x.name);try{await navigator.clipboard.writeText(text)}catch(e){let t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.focus();t.select();document.execCommand('copy');t.remove()}toast('Pesan berhasil disalin.')}function configPage(){let c=cfg();document.getElementById('content').innerHTML=`<div class="card"><h3>Config</h3><div class="field"><label>Link</label><input id="clink" value="${esc(c.invite_link||BASE)}"></div><div class="field"><label>Template WA</label><textarea id="ctemplate" rows="18">${esc(c.whatsapp_template||DEFAULT_TEMPLATE)}</textarea></div><button class="btn primary" onclick="saveConfig()">Simpan Config</button></div>`}async function saveConfig(){let r=await sb.from('config').update({invite_link:document.getElementById('clink').value.trim(),whatsapp_template:document.getElementById('ctemplate').value,updated_at:new Date().toISOString()}).eq('id',cfg().id);if(r.error)return toast(r.error.message);await loadConfig();toast('Config tersimpan.')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}if(user)start();</script></body></html>
